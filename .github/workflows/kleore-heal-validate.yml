            fi
          elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            python -m pip install --upgrade pip pytest
            [ -f requirements.txt ] && pip install -r requirements.txt || true
            pytest -k 'syncs user profile from auth service' -v --tb=short
          elif [ -f go.mod ]; then
            go test -run 'syncs user profile from auth service' -v ./...
          else
            echo "Kleore Auto-Heal: edit .github/workflows/kleore-heal-validate.yml — unsupported project type"
            exit 1
          fi
